# /etc/nginx/conf.d/artradeinternational.conf   (then: nginx -t && systemctl reload nginx)
server {
  listen 80;
  server_name artradeinternational.birgroupholdings.net;
  client_max_body_size 12m;            # blog / product image uploads (6 MB each, sent as base64)

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# HTTPS: certbot --nginx -d artradeinternational.birgroupholdings.net
