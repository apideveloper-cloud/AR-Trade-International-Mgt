# /etc/nginx/conf.d/artradeinternational.conf   (then: nginx -t && systemctl reload nginx)
server {
  listen 80;
  server_name artradeinternational.birgroupholdings.net;
  client_max_body_size 12m;            # blog / product image uploads (6 MB each, sent as base64)
  server_tokens off;

  # applicants' CVs and expense vouchers are private; the app blocks them too (defence in depth). nginx matches on the decoded path.
  location ~* ^/api/uploads/+(cv|vouchers)(/|$) { return 404; }

  # when the app is down or restarting, show a friendly page instead of nginx's plain 502/503/504
  error_page 502 503 504 /50x.html;
  location = /50x.html { root /var/www/html/artradeint_mgt/client/dist; internal; }

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # not $proxy_add_x_forwarded_for: clients must not be able to fake their IP (rate limits)
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# HTTPS: certbot --nginx -d artradeinternational.birgroupholdings.net   (it adds the 443 block and the redirect; the app sends HSTS itself once it sees https)
