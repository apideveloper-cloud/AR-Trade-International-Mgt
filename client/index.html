<style>
#splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 35%,#16306a 0%,#0b1631 70%);color:#fff;transition:opacity .6s ease,visibility .6s;font-family:'Manrope',system-ui,sans-serif}
#splash.out{opacity:0;visibility:hidden}
#splash .box{display:flex;flex-direction:column;align-items:center;gap:18px;animation:spUp .7s ease both}
#splash .lg{position:relative;width:112px;height:112px;display:grid;place-items:center}
#splash .lg img{width:92px;height:92px;border-radius:50%;background:#fff;position:relative;z-index:1;box-shadow:0 20px 44px -16px rgba(0,0,0,.6)}
#splash .lg::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:#5fb4ff;animation:spSpin 1.1s linear infinite}
#splash .lg::after{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(closest-side,rgba(95,180,255,.35),transparent);animation:spPulse 2s ease-in-out infinite}
#splash .ttl{margin:0;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:26px;letter-spacing:.04em}
#splash p{margin:0;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#9fb2da}
#splash .bar{width:170px;height:3px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden}
#splash .bar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#5fb4ff,#fff);animation:spBar 1.2s ease-in-out infinite}
@keyframes spSpin{to{transform:rotate(360deg)}}
@keyframes spPulse{50%{transform:scale(1.12);opacity:.6}}
@keyframes spBar{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes spUp{from{opacity:0;transform:translateY(14px)}}
</style>
